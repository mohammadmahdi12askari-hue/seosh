<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ورود به پنل</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<style>
body{background:#0f1115;color:#e8e8e8;display:flex;align-items:center;justify-content:center;height:100vh;font-family:Tahoma}
.card{background:#181b22;border:1px solid #2a2f3a;border-radius:16px;padding:32px;width:360px}
h3{text-align:center;margin-bottom:20px}
input{width:100%;padding:12px;background:#0f1115;border:1px solid #2a2f3a;color:#fff;border-radius:10px;margin-bottom:12px}
button{width:100%;padding:12px;background:#3b82f6;border:0;color:#fff;border-radius:10px;font-weight:bold}
.err{color:#ef4444;text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<div class="card">
  <h3>🎛 پنل مدیریت</h3>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="password" name="password" placeholder="رمز عبور" required autofocus>
    <button>ورود</button>
  </form>
</div>
</body>
</html>
